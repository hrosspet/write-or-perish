<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 14px 16px; width: 300px; color: #2a2622; background: #faf7f2; }
  h1 { font-size: 14px; font-weight: 500; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #c4956a; background: #c4956a; color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: none; color: #6b635a; border-color: #d9d2c8; }
  #last { margin-top: 12px; font-size: 12px; color: #6b635a; word-break: break-word; }
  #last.ok { color: #3f7a3f; } #last.err { color: #b3423f; }
  a { color: #c4956a; font-size: 12px; }
  .foot { margin-top: 10px; display: flex; justify-content: space-between; }
  kbd { font: 11px ui-monospace, monospace; background: #efe9e1; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
  <h1>Loore Clipper</h1>
  <div class="row">
    <button id="close">Clip &amp; close <kbd>⌥⇧L</kbd></button>
    <button id="keep" class="ghost">Clip &amp; keep <kbd>⌥⇧K</kbd></button>
  </div>
  <div id="last"></div>
  <div class="foot">
    <a id="options" href="#">Options</a>
    <a id="import" href="#" target="_blank" rel="noopener">References in Loore</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
