<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Loore Clipper options</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 18px 20px; width: 380px; color: #2a2622; background: #faf7f2; }
  h1 { font-size: 16px; font-weight: 500; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: #6b635a; margin: 12px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #d9d2c8; border-radius: 6px; font: inherit; background: #fff; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button { padding: 7px 14px; border-radius: 6px; border: 1px solid #c4956a; background: #c4956a; color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: none; color: #6b635a; border-color: #d9d2c8; }
  #status { margin-top: 12px; font-size: 12px; color: #6b635a; min-height: 18px; }
  #status.ok { color: #3f7a3f; } #status.err { color: #b3423f; }
  p.help { font-size: 12px; color: #6b635a; margin: 8px 0 0; }
  a { color: #c4956a; }
</style>
</head>
<body>
  <h1>Loore Clipper</h1>
  <label for="baseUrl">Loore instance</label>
  <select id="baseUrl">
    <option value="https://loore.org">loore.org</option>
    <option value="https://staging.loore.org">staging.loore.org</option>
    <option value="http://localhost:3001">localhost:3001 (dev)</option>
  </select>
  <label for="token">Token</label>
  <input id="token" type="password" placeholder="loore_…" autocomplete="off" spellcheck="false">
  <p class="help">Create one on the <a id="importLink" href="#" target="_blank" rel="noopener">Import page</a> under “Chrome clipper”. It can only add references to your account.</p>
  <div class="row">
    <button id="save">Save</button>
    <button id="test" class="ghost">Test connection</button>
  </div>
  <div id="status"></div>
  <p class="help">Shortcut: Alt+Shift+L clips and closes the tab, Alt+Shift+K clips and keeps it. Change them at <code>chrome://extensions/shortcuts</code>.</p>
  <script src="options.js"></script>
</body>
</html>
